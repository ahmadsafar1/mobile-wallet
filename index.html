<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>محفظتي | My Wallet</title><style>:root{--bg:#0b1220;--card:#111a2e;--card2:#182338;--line:#263449;--text:#e7eef8;--muted:#93a4bd;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--amber:#f59e0b}body.light{--bg:#eef2f7;--card:#fff;--card2:#e7edf5;--line:#cbd5e1;--text:#0f172a;--muted:#5b6b80}*{box-sizing:border-box;font-family:system-ui,'Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);padding-bottom:92px}header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:8px}header h1{margin:0;font-size:19px;flex:1}button,select,input,textarea{font-size:15px;border-radius:12px;border:1px solid var(--line);padding:12px;background:var(--card2);color:var(--text);width:100%}button{cursor:pointer;border:none;font-weight:700}.btn{padding:12px 16px}.primary{background:#2563eb;color:#fff}.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.small{padding:8px 10px;font-size:12px;width:auto}main{max-width:760px;margin:auto;padding:14px}.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30}.tabs button{flex:1;background:none;color:var(--muted);padding:9px 2px;font-size:11px;border-radius:0}.tabs button.active{color:#fff;background:#1d4ed8}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.card h2{margin:0 0 10px;font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--card2);border-radius:14px;padding:12px}.stat small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.stat b{font-size:17px}.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--amber)}.blue{color:var(--blue)}label{display:block;margin:10px 0 5px;font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--muted);font-size:11px}.badge{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700}.b-in{background:rgba(34,197,94,.15);color:#86efac}.b-out{background:rgba(239,68,68,.15);color:#fca5a5}.b-cap{background:rgba(59,130,246,.15);color:#93c5fd}.b-open{background:rgba(245,158,11,.15);color:#fcd34d}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:60}.modal.open{display:flex}.box{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.box h2{margin:0 0 12px;font-size:18px}.actions{display:flex;gap:8px;margin-top:16px}.progress{height:12px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#84cc16)}.empty{text-align:center;color:var(--muted);padding:22px;font-size:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.note{font-size:12px;color:var(--muted);line-height:1.6}.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.lock.open{display:flex}.lock-box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;max-width:360px;width:100%;text-align:center}.lock-box h2{margin:0 0 8px}.pin-dots{display:flex;justify-content:center;gap:10px;margin:18px 0}.pin-dots i{width:14px;height:14px;border-radius:50%;background:var(--card2);border:1px solid var(--line)}.pin-dots i.on{background:#3b82f6;border-color:#3b82f6}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.keypad button{padding:18px;font-size:20px}</style><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/wallet-192.png"></head><body><header><h1 id="appTitle">محفظتي</h1><button class="small ghost" onclick="setLang(L==='ar'?'en':'ar')" style="color:#fff;border-color:#ffffff55">AR/EN</button><button class="small ghost" onclick="toggleTheme()" style="color:#fff;border-color:#ffffff55">🌙</button></header><main><div id="view-home"></div><div id="view-debts" style="display:none"></div><div id="view-business" style="display:none"></div><div id="view-reports" style="display:none"></div><div id="view-settings" style="display:none"></div></main><div class="tabs"><button class="active" onclick="go('home',this)">🏠<br><span id="tHome"></span></button><button onclick="go('debts',this)">📒<br><span id="tDebts"></span></button><button onclick="go('business',this)">🏪<br><span id="tBiz"></span></button><button onclick="go('reports',this)">📊<br><span id="tRep"></span></button><button onclick="go('settings',this)">⚙️<br><span id="tSet"></span></button></div><div class="lock" id="lock"><div class="lock-box"><h2 id="lockTitle"></h2><p class="note" id="lockNote"></p><div class="pin-dots" id="pinDots"></div><div class="keypad" id="keypad"></div><div class="actions"><button class="ghost" id="lockCancel" onclick="cancelPin()">إلغاء</button></div></div></div><div class="modal" id="modal"><div class="box" id="modalBox"></div></div><script>
let DB=JSON.parse(localStorage.getItem('walletDB')||'null')||{debts:[],businesses:[],settings:{currency:'£'}};
let L=localStorage.getItem('appLang')||'ar',pinHash=localStorage.getItem('appPin')||'',pinBuffer='',pinMode='unlock',pinTemp='';
const T={ar:{app:'محفظتي',home:'الرئيسية',debts:'الديون',business:'المحلات',reports:'التقارير',settings:'الإعدادات',overview:'نظرة سريعة',youOwe:'ديون عليك',owedYou:'ديون لك',late:'متأخرة',invested:'إجمالي استثمارك',profit:'أرباح المشاريع',recovered:'استرداد رأس المال',projects:'المشاريع',quick:'إجراءات سريعة',newDebt:'➕ دين جديد',newBiz:'🏪 مشروع جديد',add:'➕ إضافة',noDebts:'لا توجد ديون.',noProjects:'أضف محلًا أو مشروعًا لبدء تتبع رأس المال والأرباح.',open:'فتح',income:'الإيرادات',expense:'المصاريف',net:'الصافي',bizReport:'تقرير المشاريع',monthly:'الإيرادات والمصاريف شهريًا',month:'الشهر',currency:'العملة',backup:'النسخ الاحتياطي',backupNote:'احفظ نسخة من بياناتك قبل تغيير الهاتف أو حذف بيانات المتصفح.',exportB:'⬇️ تصدير نسخة',importB:'⬆️ استيراد نسخة',cloud:'مزامنة سحابية',cloudNote:'لا تحتاج حسابًا لاستخدام التطبيق محليًا. للحفظ السحابي التلقائي، اربط Google Drive من Connectors.',link:'🔗 ربط Google Drive',language:'اللغة',addDebt:'إضافة دين',editDebt:'تعديل دين',person:'الشخص / الجهة',type:'النوع',amount:'المبلغ',dueDate:'تاريخ الاستحقاق',category:'الفئة',notes:'ملاحظات',save:'حفظ',cancel:'إلغاء',pay:'تسجيل دفعة',confirm:'تأكيد',remaining:'المتبقي',payFull:'سدد كامل',edit:'تعديل',addBiz:'إضافة محل / مشروع',bizName:'اسم المشروع',capital:'رأس المال المبدئي',opening:'تكلفة الفتح / التأسيس',startDate:'تاريخ البدء',addIncome:'➕ إيراد',addExpense:'➖ مصروف',addCapital:'💰 رأس مال',del:'حذف',close:'إغلاق',none:'لا يوجد',capRecovery:'استرداد رأس المال',youInvested:'استثمرت',youRecovered:'استردت',left:'متبقٍ',estimate:'التقدير: ستسترد رأس مالك بعد نحو',months:'شهر بالوتيرة الحالية',sales:'مبيعات',otherIncome:'إيراد إضافي',stock:'مخزون / بضاعة',rent:'إيجار',salaries:'رواتب',utilities:'كهرباء وماء',internet:'إنترنت',delivery:'توصيل',maintenance:'صيانة',marketing:'دعاية',taxes:'ضرائب',other:'أخرى',capAdd:'إضافة رأس مال',withdraw:'سحب أرباح',iOwe:'دين عليّ',owedMe:'دين لي',paid:'مسدد',onYou:'عليك',toYou:'لك',lock:'قفل التطبيق',lockNote:'يمكنك حماية التطبيق برقم سري. الرقم يُحفظ داخل هاتفك فقط.',setPin:'تعيين / تغيير الرقم',removePin:'إزالة القفل',enterPin:'أدخل الرقم السري',choosePin:'اختر رقمًا من 4 إلى 8 أرقام',repeatPin:'أعد إدخال الرقم',enterCurrent:'أدخل الرقم الحالي',wrongPin:'الرقم السري غير صحيح',shortPin:'الرقم يجب أن يكون 4 أرقام على الأقل',mismatch:'الرقمان غير متطابقين',lockOn:'تم تفعيل القفل',lockOff:'تم إزالة القفل'},en:{app:'My Wallet',home:'Home',debts:'Debts',business:'Business',reports:'Reports',settings:'Settings',overview:'Overview',youOwe:'You owe',owedYou:'Owed to you',late:'Overdue',invested:'Total invested',profit:'Business profit',recovered:'Capital recovered',projects:'Projects',quick:'Quick actions',newDebt:'➕ New debt',newBiz:'🏪 New business',add:'➕ Add',noDebts:'No debts.',noProjects:'Add a shop or project to track capital and profits.',open:'Open',income:'Income',expense:'Expenses',net:'Net',bizReport:'Business report',monthly:'Monthly income & expenses',month:'Month',currency:'Currency',backup:'Backup',backupNote:'Save a backup before changing phones or clearing browser data.',exportB:'⬇️ Export backup',importB:'⬆️ Import backup',cloud:'Cloud sync',cloudNote:'No account is needed for local use. Connect Google Drive in Connectors for automatic cloud backup.',link:'🔗 Connect Google Drive',language:'Language',addDebt:'Add debt',editDebt:'Edit debt',person:'Person / business',type:'Type',amount:'Amount',dueDate:'Due date',category:'Category',notes:'Notes',save:'Save',cancel:'Cancel',pay:'Record payment',confirm:'Confirm',remaining:'Remaining',payFull:'Pay in full',edit:'Edit',addBiz:'Add shop / project',bizName:'Project name',capital:'Initial capital',opening:'Opening / setup cost',startDate:'Start date',addIncome:'➕ Income',addExpense:'➖ Expense',addCapital:'💰 Capital',del:'Delete',close:'Close',none:'None',capRecovery:'Capital recovery',youInvested:'Invested',youRecovered:'Recovered',left:'Remaining',estimate:'Estimated: you will recover your capital in about',months:'months at the current pace',sales:'Sales',otherIncome:'Other income',stock:'Stock / inventory',rent:'Rent',salaries:'Salaries',utilities:'Utilities',internet:'Internet',delivery:'Delivery',maintenance:'Maintenance',marketing:'Marketing',taxes:'Taxes',other:'Other',capAdd:'Add capital',withdraw:'Withdraw profit',iOwe:'I owe',owedMe:'Owed to me',paid:'Paid',onYou:'You owe',toYou:'Owed to you',lock:'App lock',lockNote:'Protect the app with a PIN. It is stored only on your phone.',setPin:'Set / change PIN',removePin:'Remove lock',enterPin:'Enter PIN',choosePin:'Choose a 4–8 digit PIN',repeatPin:'Confirm PIN',enterCurrent:'Enter current PIN',wrongPin:'Incorrect PIN',shortPin:'PIN must be at least 4 digits',mismatch:'PINs do not match',lockOn:'App lock enabled',lockOff:'App lock removed'}};
const $=i=>document.getElementById(i),t=k=>T[L][k]||k;
const save=()=>localStorage.setItem('walletDB',JSON.stringify(DB));
const money=n=>DB.settings.currency+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10),uid=()=>Date.now()+Math.random().toString(36).slice(2);
function setLang(l){L=l;localStorage.setItem('appLang',l);document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';render()}
function openModal(h){$('modalBox').innerHTML=h;$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}
function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark')}
function go(v,b){['home','debts','business','reports','settings'].forEach(x=>$('view-'+x).style.display=x===v?'block':'none');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}
async function hashPin(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('wallet::'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function openLock(mode){pinMode=mode;pinBuffer='';pinTemp='';const titles={unlock:t('enterPin'),set:t('choosePin'),confirm:t('repeatPin'),remove:t('enterCurrent')};$('lockTitle').textContent=titles[mode];$('lockNote').textContent=mode==='unlock'?(L==='ar'?'أدخل PIN الخاص بك لفتح التطبيق':'Enter your PIN to unlock the app'):(L==='ar'?'اختر رقمًا من 4 إلى 8 أرقام':'Choose a 4–8 digit PIN');$('lockCancel').style.display=mode==='unlock'?'none':'inline-block';drawPin();$('lock').classList.add('open')}
function drawPin(){$('pinDots').innerHTML=Array.from({length:Math.max(4,pinBuffer.length)},(_,i)=>`<i class="${i<pinBuffer.length?'on':''}"></i>`).join('')}
function pressPin(n){if(n==='C'){pinBuffer='';drawPin();return}if(n==='⌫'){pinBuffer=pinBuffer.slice(0,-1);drawPin();return}if(pinBuffer.length>=8)return;pinBuffer+=n;drawPin();if(pinBuffer.length>=4)checkPin()}
async function checkPin(){const h=await hashPin(pinBuffer);if(pinMode==='unlock'){if(h===pinHash){$('lock').classList.remove('open');pinBuffer=''}else{alert(t('wrongPin'));pinBuffer='';drawPin()}return}if(pinMode==='set'){if(pinBuffer.length<4){alert(t('shortPin'));pinBuffer='';drawPin();return}pinTemp=h;pinBuffer='';openLock('confirm');return}if(pinMode==='confirm'){if(h===pinTemp){pinHash=h;localStorage.setItem('appPin',h);$('lock').classList.remove('open');alert(t('lockOn'));render()}else{alert(t('mismatch'));pinBuffer='';openLock('set')}return}if(pinMode==='remove'){if(h===pinHash){pinHash='';localStorage.removeItem('appPin');$('lock').classList.remove('open');alert(t('lockOff'));render()}else{alert(t('wrongPin'));pinBuffer='';drawPin()}}}
function cancelPin(){pinBuffer='';$('lock').classList.remove('open')}
function initLock(){$('keypad').innerHTML=[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(x=>`<button onclick="pressPin('${x}')">${x}</button>`).join('');if(pinHash)openLock('unlock')}
function debtModal(id){const d=id?DB.debts.find(x=>x.id===id):null;openModal(`<h2>${d?t('editDebt'):t('addDebt')}</h2><label>${t('person')}</label><input id="dn" value="${d?d.name:''}"><div class="grid"><div><label>${t('type')}</label><select id="dt"><option value="owe" ${d&&d.type==='owe'?'selected':''}>${t('iOwe')}</option><option value="due" ${d&&d.type==='due'?'selected':''}>${t('owedMe')}</option></select></div><div><label>${t('amount')}</label><input id="da" type="number" step="0.01" value="${d?d.amount:''}"></div></div><div class="grid"><div><label>${t('dueDate')}</label><input id="dd" type="date" value="${d?d.due||'':''}"></div><div><label>${t('category')}</label><select id="dc">${['عام/General','أصدقاء/Friends','عائلة/Family','تسوق/Shopping','فاتورة/Bill','إيجار/Rent','سيارة/Car','دراسة/Study','أخرى/Other'].map(c=>`<option ${d&&d.category===c?'selected':''}>${c}</option>`).join('')}</select></div></div><label>${t('notes')}</label><textarea id="dx" rows="2">${d?d.note||'':''}</textarea><div class="actions"><button class="primary" onclick="saveDebt('${id||''}')">${t('save')}</button><button class="ghost" onclick="closeModal()">${t('cancel')}</button></div>`)}
function saveDebt(id){const n=$('dn').value.trim(),a=parseFloat($('da').value);if(!n||!(a>0))return alert(L==='ar'?'أدخل الاسم والمبلغ':'Enter name and amount');const o={name:n,type:$('dt').value,amount:a,due:$('dd').value,category:$('dc').value,note:$('dx').value};if(id)Object.assign(DB.debts.find(x=>x.id===id),o);else DB.debts.unshift({id:uid(),paid:0,payments:[],created:today(),...o});save();closeModal();render()}
function payDebt(id){const d=DB.debts.find(x=>x.id===id),r=Math.max(0,d.amount-d.paid);openModal(`<h2>${t('pay')}</h2><p class="note">${d.name} — ${t('remaining')}: ${money(r)}</p><label>${t('amount')}</label><input id="pa" type="number" step="0.01"><label>${t('dueDate')}</label><input id="pd" type="date" value="${today()}"><div class="actions"><button class="green" onclick="savePay('${id}')">${t('confirm')}</button><button class="ghost" onclick="closeModal()">${t('cancel')}</button></div>`)}
function savePay(id){const d=DB.debts.find(x=>x.id===id),a=parseFloat($('pa').value);if(!(a>0))return alert(L==='ar'?'أدخل المبلغ':'Enter amount');const p=Math.min(a,d.amount-d.paid);d.paid=+(d.paid+p).toFixed(2);d.payments.push({amount:p,date:$('pd').value||today()});save();closeModal();render()}
function delDebt(id){if(confirm(L==='ar'?'حذف هذا الدين؟':'Delete this debt?')){DB.debts=DB.debts.filter(x=>x.id!==id);save();render()}}
function fullPay(id){const d=DB.debts.find(x=>x.id===id),r=d.amount-d.paid;if(r<=0)return;d.paid=d.amount;d.payments.push({amount:r,date:today(),note:t('paid')});save();render()}
function businessModal(id){const b=id?DB.businesses.find(x=>x.id===id):null;openModal(`<h2>${b?t('editDebt'):t('addBiz')}</h2><label>${t('bizName')}</label><input id="bn" value="${b?b.name:''}"><div class="grid"><div><label>${t('capital')}</label><input id="bc" type="number" step="0.01" value="${b?b.capital:''}"></div><div><label>${t('opening')}</label><input id="bo" type="number" step="0.01" value="${b?b.openingCost:''}"></div></div><label>${t('startDate')}</label><input id="bd" type="date" value="${b?b.startDate||today():today()}"><label>${t('notes')}</label><textarea id="bx" rows="2">${b?b.note||'':''}</textarea><div class="actions"><button class="primary" onclick="saveBusiness('${id||''}')">${t('save')}</button><button class="ghost" onclick="closeModal()">${t('cancel')}</button></div>`)}
function saveBusiness(id){const n=$('bn').value.trim();if(!n)return alert(L==='ar'?'أدخل اسم المشروع':'Enter project name');const o={name:n,capital:+($('bc').value||0),openingCost:+($('bo').value||0),startDate:$('bd').value||today(),note:$('bx').value};if(id)Object.assign(DB.businesses.find(x=>x.id===id),o);else DB.businesses.unshift({id:uid(),income:[],expense:[],capitalAdds:[],withdrawals:[],...o});save();closeModal();render()}
function txModal(bid,type){const kinds=type==='income'?[t('sales'),t('otherIncome'),t('other')]:type==='expense'?[t('stock'),t('rent'),t('salaries'),t('utilities'),t('internet'),t('delivery'),t('maintenance'),t('marketing'),t('taxes'),t('other')]:[t('capAdd'),t('withdraw')];openModal(`<h2>${type==='income'?t('addIncome'):type==='expense'?t('addExpense'):t('addCapital')}</h2><label>${t('type')}</label><select id="tk">${kinds.map(k=>`<option>${k}</option>`).join('')}</select><label>${t('amount')}</label><input id="ta" type="number" step="0.01"><label>${t('dueDate')}</label><input id="td" type="date" value="${today()}"><label>${t('notes')}</label><input id="tn"><div class="actions"><button class="${type==='income'?'green':type==='expense'?'red':'primary'}" onclick="saveTx('${bid}','${type}')">${t('save')}</button><button class="ghost" onclick="closeModal()">${t('cancel')}</button></div>`)}
function saveTx(bid,type){const a=parseFloat($('ta').value);if(!(a>0))return alert(L==='ar'?'أدخل المبلغ':'Enter amount');const b=DB.businesses.find(x=>x.id===bid);b[type].push({id:uid(),kind:$('tk').value,amount:a,date:$('td').value||today(),note:$('tn').value});save();closeModal();render()}
function delTx(bid,type,id){if(confirm(L==='ar'?'حذف الحركة؟':'Delete this entry?')){const b=DB.businesses.find(x=>x.id===bid);b[type]=b[type].filter(x=>x.id!==id);save();render()}}
function delBusiness(id){if(confirm(L==='ar'?'حذف المشروع وكل حركاته؟':'Delete project and all entries?')){DB.businesses=DB.businesses.filter(x=>x.id!==id);save();render()}}
function bizStats(b){const i=b.income.reduce((s,x)=>s+x.amount,0),e=b.expense.reduce((s,x)=>s+x.amount,0),a=b.capitalAdds.reduce((s,x)=>s+x.amount,0),w=b.withdrawals.reduce((s,x)=>s+x.amount,0),inv=(+b.capital||0)+(+b.openingCost||0)+a,net=i-e,ret=Math.max(0,net-w),rec=Math.min(inv,ret),pct=inv?Math.min(100,rec/inv*100):0,ms=b.income.length?Math.max(1,new Set(b.income.map(x=>x.date.slice(0,7))).size):0,mo=ms?ret/ms:0,ml=mo?Math.max(0,(inv-rec)/mo):null;return{i,e,a,w,inv,net,ret,rec,pct,mo,ml}}
function businessDetails(id){const b=DB.businesses.find(x=>x.id===id),s=bizStats(b);const rows=(arr,type,c)=>arr.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x.kind}</td><td>${x.note||''}</td><td class="${c}">${money(x.amount)}</td><td><button class="small red" onclick="delTx('${id}','${type}','${x.id}')">${t('del')}</button></td></tr>`).join('');openModal(`<div class="row"><h2>${b.name}</h2><button class="small red" onclick="delBusiness('${id}');closeModal()">${t('del')}</button></div><div class="grid3"><div class="stat"><small>${t('income')}</small><b class="pos">${money(s.i)}</b></div><div class="stat"><small>${t('expense')}</small><b class="neg">${money(s.e)}</b></div><div class="stat"><small>${t('net')}</small><b class="${s.net>=0?'pos':'neg'}">${money(s.net)}</b></div></div><div class="card" style="margin:12px 0;background:var(--card2)"><div class="row"><b>${t('capRecovery')}</b><b>${s.pct.toFixed(1)}%</b></div><div class="progress"><i style="width:${s.pct}%"></i></div><div class="note">${t('youInvested')} ${money(s.inv)} • ${t('youRecovered')} ${money(s.rec)} • ${t('left')} ${money(Math.max(0,s.inv-s.rec))}</div>${s.ml?`<div class="note">${t('estimate')} ${Math.ceil(s.ml)} ${t('months')}.</div>`:''}</div><div class="grid3"><button class="green" onclick="txModal('${id}','income')">${t('addIncome')}</button><button class="red" onclick="txModal('${id}','expense')">${t('addExpense')}</button><button class="primary" onclick="txModal('${id}','capital')">${t('addCapital')}</button></div><h3 style="margin-top:14px">${t('income')}</h3><table><tr><th>${t('dueDate')}</th><th>${t('type')}</th><th>${t('notes')}</th><th>${t('amount')}</th><th></th></tr>${rows(b.income,'income','pos')||`<tr><td colspan=5 class=empty>${t('none')}</td></tr>`}</table><h3 style="margin-top:14px">${t('expense')}</h3><table><tr><th>${t('dueDate')}</th><th>${t('type')}</th><th>${t('notes')}</th><th>${t('amount')}</th><th></th></tr>${rows(b.expense,'expense','neg')||`<tr><td colspan=5 class=empty>${t('none')}</td></tr>`}</table><h3 style="margin-top:14px">${t('capital')} / ${t('withdraw')}</h3><table><tr><th>${t('dueDate')}</th><th>${t('type')}</th><th>${t('notes')}</th><th>${t('amount')}</th><th></th></tr>${[...b.capitalAdds.map(x=>({...x,kind:t('capAdd')})),...b.withdrawals.map(x=>({...x,kind:t('withdraw')}))].sort((a,c)=>c.date>a.date?1:-1).map(x=>`<tr><td>${x.date}</td><td>${x.kind}</td><td>${x.note||''}</td><td>${money(x.amount)}</td><td><button class="small red" onclick="delTx('${id}','${x.kind===t('capAdd')?'capitalAdds':'withdrawals'}','${x.id}')">${t('del')}</button></td></tr>`).join('')||`<tr><td colspan=5 class=empty>${t('none')}</td></tr>`}</table><div class="actions"><button class="ghost" onclick="closeModal()">${t('close')}</button></div>`)}
function render(){$('appTitle').textContent=t('app');$('tHome').textContent=t('home');$('tDebts').textContent=t('debts');$('tBiz').textContent=t('business');$('tRep').textContent=t('reports');$('tSet').textContent=t('settings');const owe=DB.debts.filter(d=>d.type==='owe').reduce((s,d)=>s+Math.max(0,d.amount-d.paid),0),due=DB.debts.filter(d=>d.type==='due').reduce((s,d)=>s+Math.max(0,d.amount-d.paid),0),late=DB.debts.filter(d=>d.due&&d.amount-d.paid>0&&d.due<today()).length,inv=DB.businesses.reduce((s,b)=>s+bizStats(b).inv,0),net=DB.businesses.reduce((s,b)=>s+bizStats(b).net,0),rec=DB.businesses.reduce((s,b)=>s+bizStats(b).rec,0);
$('view-home').innerHTML=`<div class="card"><h2>${t('overview')}</h2><div class="grid3"><div class="stat"><small>${t('youOwe')}</small><b class="neg">${money(owe)}</b></div><div class="stat"><small>${t('owedYou')}</small><b class="pos">${money(due)}</b></div><div class="stat"><small>${t('late')}</small><b class="warn">${late}</b></div></div><div class="grid3" style="margin-top:10px"><div class="stat"><small>${t('invested')}</small><b class="blue">${money(inv)}</b></div><div class="stat"><small>${t('profit')}</small><b class="${net>=0?'pos':'neg'}">${money(net)}</b></div><div class="stat"><small>${t('recovered')}</small><b class="pos">${money(rec)}</b></div></div></div><div class="card"><h2>${t('projects')}</h2>${DB.businesses.map(b=>{const s=bizStats(b);return `<div class="stat" style="margin-bottom:10px"><div class="row"><b>${b.name}</b><span class="badge ${s.net>=0?'b-in':'b-out'}">${money(s.net)}</span></div><div class="progress"><i style="width:${s.pct}%"></i></div><small>${t('capRecovery')}: ${s.pct.toFixed(1)}%</small></div>`}).join('')||`<div class="empty">${t('noProjects')}</div>`}</div><div class="card"><h2>${t('quick')}</h2><div class="grid"><button class="primary" onclick="debtModal()">${t('newDebt')}</button><button class="green" onclick="businessModal()">${t('newBiz')}</button></div></div>`;
$('view-debts').innerHTML=`<div class="card"><div class="row"><h2>${t('debts')}</h2><button class="small primary" onclick="debtModal()">${t('add')}</button></div>${DB.debts.map(d=>{const r=Math.max(0,d.amount-d.paid),lt=d.due&&r>0&&d.due<today();return `<div class="stat" style="margin-bottom:10px"><div class="row"><b>${d.name}</b><span class="badge ${r<=0?'b-cap':lt?'b-open':d.type==='owe'?'b-out':'b-in'}">${r<=0?t('paid'):lt?t('late'):d.type==='owe'?t('onYou'):t('toYou')}</span></div><div class="row"><small>${d.category||''}</small><b class="${d.type==='owe'?'neg':'pos'}">${money(r)}</b></div><div class="grid3" style="margin-top:8px"><button class="small green" onclick="payDebt('${d.id}')">${t('pay')}</button><button class="small primary" onclick="fullPay('${d.id}')">${t('payFull')}</button><button class="small ghost" onclick="debtModal('${d.id}')">${t('edit')}</button></div></div>`}).join('')||`<div class="empty">${t('noDebts')}</div>`}</div>`;
$('view-business').innerHTML=`<div class="card"><div class="row"><h2>${t('business')}</h2><button class="small primary" onclick="businessModal()">${t('add')}</button></div>${DB.businesses.map(b=>{const s=bizStats(b);return `<div class="stat" style="margin-bottom:12px"><div class="row"><b>${b.name}</b><button class="small ghost" onclick="businessDetails('${b.id}')">${t('open')}</button></div><div class="grid3" style="margin-top:8px"><div><small>${t('income')}</small><b class="pos">${money(s.i)}</b></div><div><small>${t('expense')}</small><b class="neg">${money(s.e)}</b></div><div><small>${t('net')}</small><b class="${s.net>=0?'pos':'neg'}">${money(s.net)}</b></div></div><div class="progress"><i style="width:${s.pct}%"></i></div><small>${t('capRecovery')}: ${s.pct.toFixed(1)}%</small></div>`}).join('')||`<div class="empty">${t('noProjects')}</div>`}</div>`;
const months={};DB.businesses.forEach(b=>{[...b.income,...b.expense].forEach(x=>{const m=x.date.slice(0,7);months[m]??={i:0,e:0};if(b.income.some(y=>y.id===x.id))months[m].i+=x.amount;else months[m].e+=x.amount})});const keys=Object.keys(months).sort();
$('view-reports').innerHTML=`<div class="card"><h2>${t('bizReport')}</h2><table><tr><th>${t('bizName')}</th><th>${t('invested')}</th><th>${t('net')}</th><th>${t('capRecovery')}</th></tr>${DB.businesses.map(b=>{const s=bizStats(b);return `<tr><td>${b.name}</td><td>${money(s.inv)}</td><td class="${s.net>=0?'pos':'neg'}">${money(s.net)}</td><td>${s.pct.toFixed(1)}%</td></tr>`}).join('')||`<tr><td colspan=4 class=empty>${t('none')}</td></tr>`}</table></div><div class="card"><h2>${t('monthly')}</h2><table><tr><th>${t('month')}</th><th>${t('income')}</th><th>${t('expense')}</th><th>${t('net')}</th></tr>${keys.map(m=>`<tr><td>${m}</td><td class="pos">${money(months[m].i)}</td><td class="neg">${money(months[m].e)}</td><td class="${months[m].i-months[m].e>=0?'pos':'neg'}">${money(months[m].i-months[m].e)}</td></tr>`).join('')||`<tr><td colspan=4 class=empty>${t('none')}</td></tr>`}</table></div>`;
$('view-settings').innerHTML=`<div class="card"><h2>${t('lock')}</h2><p class="note">${t('lockNote')}</p><div class="grid"><button class="primary" onclick="openLock('set')">${t('setPin')}</button><button class="red" onclick="openLock('remove')" ${pinHash?'':'disabled'}>${t('removePin')}</button></div></div><div class="card"><h2>${t('language')}</h2><div class="grid"><button class="ghost" onclick="setLang('ar')">العربية</button><button class="ghost" onclick="setLang('en')">English</button></div></div><div class="card"><h2>${t('currency')}</h2><input value="${DB.settings.currency}" onchange="DB.settings.currency=this.value;save();render()"></div><div class="card"><h2>${t('backup')}</h2><p class="note">${t('backupNote')}</p><div class="grid"><button class="primary" onclick="exportDB()">${t('exportB')}</button><button class="ghost" onclick="$('imp').click()">${t('importB')}</button></div><input type="file" id="imp" accept=".json" style="display:none" onchange="importDB(event)"></div><div class="card"><h2>${t('cloud')}</h2><p class="note">${t('cloudNote')}</p><button class="ghost" onclick="alert('${t('cloudNote')}')">${t('link')}</button></div>`}
function exportDB(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));a.download='wallet-backup-'+today()+'.json';a.click()}
function importDB(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.debts||!x.businesses)throw 0;if(!confirm(L==='ar'?'سيتم استبدال البيانات الحالية. متابعة؟':'Current data will be replaced. Continue?'))return;DB=x;save();render();alert(L==='ar'?'تم الاستيراد':'Imported')}catch{alert(L==='ar'?'ملف غير صالح':'Invalid file')}};r.readAsText(f);e.target.value=''}
document.body.classList.add(localStorage.getItem('theme')||'dark');document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';render();initLock();
</script><script src="./wallet-lock.js"></script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(console.error)}</script><script src="./grouped-debts.js"></script><script src="./wallet-core.js"></script><script src="./wallet-features.js"></script><script src="./wallet-simple.js"></script></body></html>
