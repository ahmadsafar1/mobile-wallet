name: Repair and publish wallet
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-wallet.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: wallet-pages
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Repair application files
        shell: python
        run: |
          from pathlib import Path
          import re, json, struct, zlib
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          assert 'walletDB' in s and 'function openLock(' in s, 'Unexpected application; refusing to overwrite'
          s = re.sub(r'<link\s+rel=[\"\x27]manifest[\"\x27][^>]*>', '', s, flags=re.I)
          tags = '<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/wallet-192.png">'
          s = s.replace('</head>', tags + '</head>')
          if 'src="./wallet-lock.js"' not in s:
              s = s.replace('</body>', '<script src="./wallet-lock.js"></script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(console.error)}</script></body>')
          p.write_text(s, encoding='utf-8')
          manifest = {'id':'./','name':'محفظتي / My Wallet','short_name':'Wallet','start_url':'./','scope':'./','display':'standalone','background_color':'#0b1220','theme_color':'#0f172a','icons':[{'src':f'./icons/wallet-{n}.png','sizes':f'{n}x{n}','type':'image/png','purpose':'any'} for n in (192,512)]}
          Path('manifest.webmanifest').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('icons').mkdir(exist_ok=True)
          def chunk(t,b):
              return struct.pack('!I',len(b))+t+b+struct.pack('!I',zlib.crc32(t+b)&0xffffffff)
          for n in (192,512):
              rows=[]
              for y in range(n):
                  row=bytearray([0])
                  for x in range(n):
                      c=(15,23,42)
                      if .15*n<x<.85*n and .28*n<y<.75*n: c=(37,99,235)
                      if .57*n<x<.87*n and .43*n<y<.61*n: c=(34,197,94)
                      if (x-.70*n)**2+(y-.52*n)**2 < (.028*n)**2: c=(255,255,255)
                      row.extend(c)
                  rows.append(bytes(row))
              png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('!2I5B',n,n,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(b''.join(rows)))+chunk(b'IEND',b'')
              Path(f'icons/wallet-{n}.png').write_bytes(png)
          Path('wallet-lock.js').write_text(r'''
          // Local UI lock only. Existing walletDB data and PIN hash format are preserved.
          let walletPinBusy=false, walletPinFailures=0, walletPinUntil=0;
          const walletText=(ar,en)=>L==='ar'?ar:en;
          const walletOldRender=render;
          render=function(){walletOldRender();const c=document.querySelector('#view-settings button[onclick="openLock(\'set\')"]');if(c)c.onclick=()=>openLock(pinHash?'change':'set');};
          openLock=function(mode){
            pinMode=mode;pinBuffer='';if(mode!=='confirm')pinTemp='';
            const titles={unlock:t('enterPin'),set:t('choosePin'),confirm:t('repeatPin'),remove:t('enterCurrent'),change:t('enterCurrent')};
            $('lockTitle').textContent=titles[mode]||t('enterPin');
            $('lockNote').textContent=walletText('أدخل من 4 إلى 8 أرقام ثم اضغط تأكيد. هذا القفل لا يشفّر البيانات.','Enter 4–8 digits, then Confirm. This lock does not encrypt data.');
            $('lockCancel').style.display=mode==='unlock'?'none':'inline-block';$('lockCancel').textContent=t('cancel');
            drawPin();$('lock').classList.add('open');
          };
          pressPin=function(n){
            if(walletPinBusy)return;
            if(n==='C')pinBuffer='';else if(n==='⌫')pinBuffer=pinBuffer.slice(0,-1);else if(/^\d$/.test(n)&&pinBuffer.length<8)pinBuffer+=n;
            drawPin();
          };
          checkPin=async function(){
            if(walletPinBusy)return;
            if(Date.now()<walletPinUntil){alert(walletText('انتظر قليلًا قبل المحاولة مجددًا.','Please wait before trying again.'));return;}
            if(!/^\d{4,8}$/.test(pinBuffer)){alert(t('shortPin'));return;}
            walletPinBusy=true;
            try{
              const h=await hashPin(pinBuffer),mode=pinMode;
              if(mode==='set'){pinTemp=h;openLock('confirm');return;}
              if(mode==='confirm'){
                if(h!==pinTemp){pinBuffer='';drawPin();alert(t('mismatch'));return;}
                localStorage.setItem('appPin',h);pinHash=h;pinTemp='';pinBuffer='';$('lock').classList.remove('open');render();alert(t('lockOn'));return;
              }
              if(h!==pinHash){walletPinFailures++;if(walletPinFailures>=5){walletPinUntil=Date.now()+30000;walletPinFailures=0;}pinBuffer='';drawPin();alert(t('wrongPin'));return;}
              walletPinFailures=0;walletPinUntil=0;
              if(mode==='change'){openLock('set');return;}
              if(mode==='remove'){localStorage.removeItem('appPin');pinHash='';}
              pinBuffer='';$('lock').classList.remove('open');render();
            }catch(e){alert(walletText('تعذّر إتمام العملية. افتح رابط HTTPS وحاول مجددًا.','Operation failed. Open the HTTPS site and try again.'));console.error(e);}
            finally{walletPinBusy=false;}
          };
          initLock=function(){
            $('keypad').dir='ltr';$('keypad').innerHTML=[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(x=>`<button onclick="pressPin('${x}')">${x}</button>`).join('')+`<button class="primary" style="grid-column:1/-1" onclick="checkPin()">${t('confirm')}</button>`;
            if(pinHash)openLock('unlock');
          };
          document.addEventListener('visibilitychange',()=>{if(document.hidden&&pinHash){closeModal();openLock('unlock');}});
          render();initLock();
          ''',encoding='utf-8')
          Path('sw.js').write_text('''
          const CACHE='mobile-wallet-shell-v1';
          const ASSETS=['./','./index.html','./manifest.webmanifest','./wallet-lock.js','./icons/wallet-192.png','./icons/wallet-512.png'];
          self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting()));});
          self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('mobile-wallet-shell-')&&k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});
          self.addEventListener('fetch',e=>{const u=new URL(e.request.url);if(e.request.method!=='GET'||u.origin!==self.location.origin||!u.href.startsWith(self.registration.scope))return;e.respondWith(fetch(e.request).then(r=>{if(r.ok){const copy=r.clone();e.waitUntil(caches.open(CACHE).then(c=>c.put(e.request,copy)));}return r;}).catch(()=>caches.match(e.request).then(r=>r||(e.request.mode==='navigate'?caches.match('./index.html'):Response.error()))));});
          ''',encoding='utf-8')
          assert len(json.loads(Path('manifest.webmanifest').read_text())['icons'])==2
          print('Generated installation assets; preserved walletDB storage.')
      - name: Check JavaScript syntax
        run: |
          node --check wallet-lock.js
          node --check sw.js
      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest wallet-lock.js sw.js icons/wallet-192.png icons/wallet-512.png
          git diff --cached --quiet || (git commit -m "Fix wallet installation assets and PIN confirmation" && git push origin HEAD:main)
      - name: Prepare Pages artifact
        run: |
          mkdir -p /tmp/wallet-site/icons
          cp index.html manifest.webmanifest wallet-lock.js sw.js /tmp/wallet-site/
          cp icons/wallet-192.png icons/wallet-512.png /tmp/wallet-site/icons/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/wallet-site
      - uses: actions/deploy-pages@v4
        id: deployment
