name: Publish simplified wallet v4
on:
  workflow_dispatch:
  push:
    paths:
      - 'wallet-simple.js'
      - '.github/workflows/simple-wallet.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: wallet-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Integrate simplified interface
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert './wallet-features.js' in s, 'Version 3 integration is required'
          tag='<script src="./wallet-simple.js"></script>'
          if './wallet-simple.js' not in s:s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'mobile-wallet-shell-v[0-9]+','mobile-wallet-shell-v4',s)
          if "'./wallet-simple.js'" not in s:s=s.replace("'./wallet-features.js',","'./wallet-features.js','./wallet-simple.js',")
          p.write_text(s,encoding='utf-8')
      - name: Check syntax and calculations
        run: |
          node --check wallet-simple.js
          node --check sw.js
          node -e "const a=require('assert'),c=require('./wallet-simple.js');const b={simpleSetup:{total:6000,capital:1500},simpleEntries:[{kind:'profit',amount:200}]};a.equal(c.calculate(b).opening,4300);a.equal(c.calculate(b).capital,1700);b.simpleEntries.push({kind:'pay',amount:200});a.equal(c.calculate(b).total,6200);a.equal(c.calculate(b).capital,1900);b.simpleEntries.push({kind:'withdraw',amount:100});a.equal(c.calculate(b).opening,4200);a.equal(c.calculate(b).capital,1900);a.equal(c.monthTotals({personalIncome:[{date:'2026-11-01',amount:1000}],debts:[{recurringId:'r',type:'owe',payments:[{date:'2026-11-02',amount:100}]}]},'2026-11').left,900);"
      - name: Save integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || (git commit -m "Integrate simplified wallet v4 without deleting stored records" && git push origin HEAD:main)
      - name: Prepare site
        run: |
          mkdir -p /tmp/wallet-site/icons
          cp index.html manifest.webmanifest wallet-lock.js grouped-debts.js wallet-core.js wallet-features.js wallet-simple.js sw.js /tmp/wallet-site/
          cp icons/*.png /tmp/wallet-site/icons/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/wallet-site
      - uses: actions/deploy-pages@v4
        id: deployment
