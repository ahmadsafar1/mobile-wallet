name: Complete wallet priorities recurring payments and profit tracking
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/complete-wallet.yml'
      - 'wallet-core.js'
      - 'wallet-features.js'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: wallet-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Integrate additions preserving stored records
        shell: python
        run: |
          from pathlib import Path
          p=Path('grouped-debts.js')
          s=p.read_text(encoding='utf-8')
          if 'const priorityOptions=' not in s:
              patches=[("let selected=null,history=false,query='';", "let selected=null,history=false,query='',priorityFilter='';\nconst priorityOptions=()=>[['urgent',text('عاجل','Urgent'),'#ef4444'],['soon',text('قريب','Soon'),'#f59e0b'],['normal',text('غير عاجل','Normal'),'#22c55e']];\n"), ('const rows=all.filter(({d})=>history?remain(d)===0:remain(d)>0);', "const rows=all.filter(({d})=>(history?remain(d)===0:remain(d)>0)&&(!priorityFilter||(d.priority||'normal')===priorityFilter));"), ('    if(selected===null){', "    const urgencies=makePriorities();panel.append(urgencies);\n    function makePriorities(){\n      const wrap=document.createElement('div');wrap.className='actions';\n      wrap.append(button(text('كل الدرجات','All priorities'),()=>{priorityFilter='';draw();}));\n      for(const [value,name,color] of priorityOptions()){\n        const n=DB.debts.filter(d=>remain(d)>0&&(d.priority||'normal')===value).length;\n        const b=button(name+' ('+n+')',()=>{priorityFilter=value;draw();});b.style.border='2px solid '+color;b.style.color=color;if(priorityFilter===value)b.style.background='#1e293b';wrap.append(b);\n      }return wrap;\n    }\n    if(selected===null){"), ("      const info=document.createElement('p');info.className='note';", "      const priority=document.createElement('select');priority.setAttribute('aria-label',text('درجة الاستعجال','Urgency'));\n      for(const [value,name,color] of priorityOptions()){const option=document.createElement('option');option.value=value;option.textContent=name;priority.append(option);}\n      priority.value=d.priority||'normal';priority.style.borderColor=priorityOptions().find(x=>x[0]===priority.value)?.[2]||'#22c55e';priority.onchange=()=>{d.priority=priority.value;save();render();};card.append(priority);\n      const info=document.createElement('p');info.className='note';")]
              for old,new in patches:
                  assert old in s, 'Unexpected grouped debt version; no deployment performed'
                  s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert './grouped-debts.js' in s, 'Missing grouped debt integration'
          tag='<script src="./wallet-core.js"></script><script src="./wallet-features.js"></script>'
          if './wallet-features.js' not in s:s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r"mobile-wallet-shell-v[0-9]+",'mobile-wallet-shell-v3',s)
          if "'./wallet-features.js'" not in s:s=s.replace("'./grouped-debts.js',","'./grouped-debts.js','./wallet-core.js','./wallet-features.js',")
          p.write_text(s,encoding='utf-8')
      - name: Check JavaScript and accounting logic
        run: |
          node --check wallet-core.js
          node --check wallet-features.js
          node --check grouped-debts.js
          node --check sw.js
          node -e "const a=require('assert'),c=require('./wallet-core.js');const s=c.stats({capital:6000,walletEntries:[{kind:'profit',amount:300},{kind:'reinvest',amount:300}]});a.equal(s.net,300);a.equal(s.inv,6000);a.equal(s.left,5700);a.equal(s.pct,5);a.equal(s.returned,0);a.equal(c.nextDate('2026-01-31',1,'monthly'),'2026-02-28');a.equal(c.nextDate('2026-01-31',2,'monthly'),'2026-03-31');a.equal(c.stats({capital:55,walletEntries:[{kind:'sale',amount:100,cost:55},{kind:'inventory',amount:100}]}).net,45);"
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html grouped-debts.js sw.js
          git diff --cached --quiet || (git commit -m "Integrate priorities recurring schedules and reinvested profit tracking" && git push origin HEAD:main)
      - name: Prepare site
        run: |
          mkdir -p /tmp/wallet-site/icons
          cp index.html manifest.webmanifest wallet-lock.js grouped-debts.js wallet-core.js wallet-features.js sw.js /tmp/wallet-site/
          cp icons/*.png /tmp/wallet-site/icons/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/wallet-site
      - uses: actions/deploy-pages@v4
        id: deployment
